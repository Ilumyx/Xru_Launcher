<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRU Array — Blind test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/rail.css">
  <link rel="stylesheet" href="css/array.css">
  <link rel="stylesheet" href="css/account.css">
  <script src="js/account.js"></script>
</head>
<body>
  <div class="shell">
    <!-- Rail giống Launcher: logo → 4 lục địa → vạch → search (đang ở đây) -->
    <nav class="rail" aria-label="Lục địa Liên Bang">
      <div class="rail-top">
        <a href="launcher_mockup.html?continent=xru" class="rail-logo" data-tooltip="Về Launcher (ESC)" style="text-decoration:none;">
          <svg viewBox="140 60 520 520" fill="currentColor">
            <mask id="xru-emblem-mask">
              <rect x="100" y="0" width="600" height="600" fill="#fff"/>
              <rect x="140" y="305" width="80" height="30" fill="#000"/>
              <rect x="580" y="305" width="80" height="30" fill="#000"/>
            </mask>
            <circle cx="400" cy="320" r="220" fill="none" stroke="currentColor" stroke-width="40" mask="url(#xru-emblem-mask)"/>
            <rect x="290" y="240" width="40" height="150" fill="currentColor"/>
            <rect x="470" y="240" width="40" height="150" fill="currentColor"/>
            <rect x="290" y="420" width="220" height="30" fill="currentColor"/>
            <rect x="382" y="145" width="36" height="80" fill="currentColor"/>
            <circle cx="400" cy="320" r="35" fill="currentColor"/>
          </svg>
        </a>
        <div class="rail-nav">
          <a href="launcher_mockup.html?continent=euramerika" class="rail-icon-btn" data-tooltip="EURAMERIKA">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
          </a>
          <a href="launcher_mockup.html?continent=eurasia" class="rail-icon-btn" data-tooltip="EURASIA">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </a>
          <a href="launcher_mockup.html?continent=euruska" class="rail-icon-btn" data-tooltip="EURUSKA">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/><polygon points="11 10 14 12 11 14" fill="currentColor"/></svg>
          </a>
          <a href="launcher_mockup.html?continent=europa" class="rail-icon-btn" data-tooltip="EUROPA">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M3.5 9h17M3.5 15h17"/></svg>
          </a>
          <div class="rail-divider"></div>
          <a href="array_search.html" class="rail-icon-btn is-active" data-tooltip="Array — blind test (/)">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-4.35-4.35"/></svg>
          </a>
        </div>
      </div>
      <div class="rail-bottom"><div class="user-avatar" title="Ilumyx (PO)">IL</div></div>
    </nav>

    <div class="ax">
      <!-- CỘT GIỮA: ô tra + Array hiểu thành + kết quả -->
      <main class="ax-main">
        <header class="ax-head">
          <div class="ax-title"><a href="launcher_mockup.html">XRU</a><span>/</span><h1>ARRAY</h1><em>blind test</em></div>
          <div class="ax-gen" id="ax-gen" title="Thế hệ kho Array lúc chụp"></div>
        </header>

        <form class="ax-search" id="ax-form" autocomplete="off">
          <svg class="ax-search-ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M21 21l-4.35-4.35"/></svg>
          <input id="ax-q" placeholder="tank + 3bm42   ·   Russia tank 125mm   ·   tank !Russia" spellcheck="false">
          <kbd>Enter</kbd>
        </form>
        <div class="ax-pills" id="ax-pills"></div>

        <!-- Nguồn index: hiện chỉ có Atlas -->
        <nav class="ax-sources" aria-label="Nguồn index">
          <button class="is-active">Atlas <b id="ax-src-count">—</b></button>
          <button disabled title="Chưa index">Wiki XRU <i>chưa index</i></button>
          <button disabled title="Chưa index">Kho Liên Bang <i>chưa index</i></button>
        </nav>

        <section class="ax-sec">
          <h2>Array hiểu thành</h2>
          <div class="ax-clauses" id="ax-clauses"></div>
          <div class="ax-reasons" id="ax-reasons" hidden></div>
        </section>

        <section class="ax-sec" id="ax-cooc-sec" hidden>
          <h2>Tag hay đi cùng <span>trong tập kết quả</span></h2>
          <div class="ax-cooc" id="ax-cooc"></div>
        </section>

        <section class="ax-sec">
          <h2>Kết quả <span id="ax-total"></span></h2>
          <div class="ax-results" id="ax-results"></div>
        </section>

        <footer class="ax-foot">
          <span><kbd>/</kbd> gõ câu</span><span><kbd>↑</kbd><kbd>↓</kbd> chọn dòng</span><span><kbd>ESC</kbd> về Launcher</span>
          <span class="ax-foot-r">Mockup · dữ liệu chụp thật từ Array, chỉ đọc</span>
        </footer>
      </main>

      <!-- CỘT PHẢI: thẻ kiến thức của entry đang chọn (kiểu khung bên phải của Google) -->
      <aside class="ax-panel" id="ax-panel"></aside>
    </div>
  </div>
  <div class="ax-toast" id="ax-toast"></div>

  <script src="data/array_snapshot.js"></script>
  <script src="js/array.js"></script>
</body>
</html>
