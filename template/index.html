<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Màn mới · XRU</title>
  <link rel="stylesheet" href="color.css">
  <style>
    :root {
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
      --space-6:24px; --space-8:32px; --space-12:48px;
      --h-control:40px; --h-action:44px; --radius:2px;
    }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; height:100%; }
    body { background:var(--bg); color:var(--fg); font:14px/1.5 var(--font-sans); }
    a { color:inherit; text-decoration:none; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button,a,select { touch-action:manipulation; }
    :focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
    .screen { display:grid; grid-template-columns:64px 240px minmax(0,1fr); height:100dvh; }
    .rail { display:flex; flex-direction:column; align-items:center; gap:20px; padding:20px 8px; background:var(--bg); border-right:1px solid var(--line); }
    .rail a { display:grid; place-items:center; width:44px; min-height:40px; color:var(--fg-dim); font:12px var(--font-mono); }
    .rail a:hover,.rail a[aria-current] { background:var(--panel); color:var(--fg-strong); }
    .rail .rail-account { margin-top:auto; }
    .filter-shelf { display:flex; flex-direction:column; gap:24px; min-height:0; padding:24px 20px; background:var(--panel); overflow:auto; }
    .filter-shelf h2 { margin:0; color:var(--fg-strong); font-size:16px; }
    .filter-shelf label { display:flex; flex-direction:column; gap:8px; font-size:13px; }
    .filter-shelf select { width:100%; background:var(--surface); border:0; padding:10px; }
    .screen-body { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; min-height:0; }
    .page-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; padding:20px 24px; border-bottom:1px solid var(--line); }
    .page-head h1 { margin:0; font-size:22px; color:var(--fg-strong); }
    .room { min-width:0; min-height:0; overflow:auto; }
    .page-foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 24px; border-top:1px solid var(--line); color:var(--fg-dim); font:12px var(--font-mono); }
    @media(max-width:760px) {
      .screen { grid-template-columns:52px minmax(0,1fr); height:auto; min-height:100dvh; }
      .rail { grid-row:1 / 3; padding:16px 4px; }
      .filter-shelf { grid-column:2; max-height:340px; }
      .screen-body { grid-column:2; min-height:70dvh; }
      .page-head,.page-foot { padding:16px; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <nav class="rail" aria-label="Điều hướng">
      <a href="./" aria-label="Trang đầu">XRU</a>
      <a href="./" aria-current="page" aria-label="Màn hiện tại">01</a>
    </nav>
    <aside class="filter-shelf" aria-label="Bộ lọc">
      <h2>Bộ lọc</h2>
      <label>Phạm vi<select><option>Tất cả</option></select></label>
    </aside>
    <div class="screen-body">
      <header class="page-head"><h1>Màn mới</h1><span>XRU</span></header>
      <main class="room" aria-label="Nội dung"></main>
      <footer class="page-foot"><span>Màn mới</span><span>XRU</span></footer>
    </div>
  </div>
</body>
</html>
