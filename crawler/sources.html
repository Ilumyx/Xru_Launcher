<!doctype html>
<!-- Mặt chép từ mockup PO đã duyệt: Xru_Launcher 544f36f^:mockups/crawler_sources.html. Số thật từ /api/board. -->
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRU Crawler — Nguồn đã thêm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/kit/tokens.css"><link rel="stylesheet" href="/kit/rail/rail.css"><link rel="stylesheet" href="/kit/page/page.css"><link rel="stylesheet" href="/kit/sidebar/sidebar.css"><link rel="stylesheet" href="crawler.css">
  <link rel="stylesheet" href="/kit/account/account.css"><script src="/kit/i18n/i18n.js"></script><script src="/kit/account/account.js"></script><script src="/kit/sidebar/sidebar.js"></script>
  <script>window.XRU_RAILS = { crawler: { label: "Crawler", home: "/?continent=eurasia", homeTip: "Về sảnh (ESC)",
    groups: [[{ key: "dash", href: "/crawler/dash", icon: "bars", tip: "Dashboard" }, { key: "sources", href: "/crawler/sources", icon: "table", tip: "Nguồn" }]] } };</script>
</head>
<body><div class="shell">
  <nav class="rail" data-rail="crawler" data-panel data-active="sources"></nav><script src="/kit/rail/rail.js"></script>
<div class="cr-ws">
  <aside class="side">
    <div class="side-head">
      <div class="side-count"><b id="cr-count">—</b><span>NGUỒN</span></div>
      <label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input type="search" id="cr-q" placeholder="Tên cụm hoặc nền tảng…" aria-label="Tìm nguồn"></label>
      <div class="side-field"><label for="cr-sort">Sắp xếp</label><select id="cr-sort"><option value="issue">Có vấn đề trước</option><option value="name">Tên A → Z</option><option value="pending">Chờ tải nhiều nhất</option><option value="recent">Nhận mới gần nhất</option><option value="image">Nhiều ảnh nhất</option><option value="image_asc">Ít ảnh nhất</option><option value="video">Nhiều video nhất</option><option value="video_asc">Ít video nhất</option></select></div>
    </div>
    <div class="side-items" id="cr-filters"></div>
  </aside>
  <div class="cr-scroll">
  <main class="cr-stage">
    <header class="page-head"><div class="page-title"><a href="/?continent=eurasia">EURASIA</a><span>/</span><a href="/crawler/dash" data-keep-scope>CRAWLER</a><span>/</span><h1>NGUỒN</h1></div><div class="cr-active"><span id="cr-active"></span><button type="button" id="cr-clear" hidden>Bỏ lọc</button></div></header><div id="cr-error" role="alert" hidden></div>

    <div class="cr-table-wrap"><table class="cr-table" data-source-table><thead><tr><th class="c-name">CỤM</th><th class="c-plat">PLATFORM</th><th class="c-tag">TAG</th><th class="c-media cr-sortable" data-sort-media="image">ẢNH</th><th class="c-media cr-sortable" data-sort-media="video">VIDEO</th></tr></thead><tbody></tbody></table></div><div class="cr-empty" id="source-empty" hidden>Không có nguồn phù hợp.</div><p class="cr-label" id="source-result-count" style="margin-top:20px"></p><dialog class="cr-dialog" id="source-detail" aria-labelledby="source-detail-name"><header><h2 id="source-detail-name"></h2><button id="source-detail-close" aria-label="Đóng chi tiết">Đóng ×</button></header><dl><dt>Cụm</dt><dd id="source-detail-cluster"></dd><dt>Trạng thái</dt><dd id="source-detail-state"></dd><dt>Nền tảng</dt><dd id="source-detail-platform"></dd><dt>Link đã tìm</dt><dd id="source-detail-found"></dd><dt>Đã sinh</dt><dd id="source-detail-assets"></dd><dt>Link chờ</dt><dd id="source-detail-pending"></dd><dt>Nhận mới</dt><dd id="source-detail-last"></dd><dt>Lỗi gần nhất</dt><dd id="source-detail-error"></dd><dt>Ghi chú PO</dt><dd id="source-detail-note"></dd></dl></dialog>
    <footer class="page-foot"><div class="key-hints"><span><span class="key">1</span> Dashboard</span><span><span class="key">2</span> Nguồn</span><span><span class="key">ESC</span> Sảnh</span></div><div id="cr-foot">CHỈ ĐỌC · ẢNH + VIDEO</div></footer>
  </main>
  </div>
</div>
</div><script src="crawler.js"></script></body></html>
