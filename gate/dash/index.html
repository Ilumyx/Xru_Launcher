<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRU Gate — Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/kit/tokens.css">
  <link rel="stylesheet" href="/kit/rail/rail.css">
  <link rel="stylesheet" href="/kit/page/page.css">
  <link rel="stylesheet" href="/kit/sidebar/sidebar.css"><link rel="stylesheet" href="/kit/frame/frame.css">
  <link rel="stylesheet" href="/kit/account/account.css">
  <script src="/kit/i18n/i18n.js"></script>
  <script src="/kit/account/account.js"></script>
  <script src="/kit/frame/frame.js"></script>
  <link rel="stylesheet" href="/gate/dash/dashboard.css">
<script src="/gate/dash/dashboard_text.js"></script>
</head>
<body >
<div class="shell">
  <script src="/gate/rail_menu.js"></script>
  <nav class="rail" data-rail="gate" data-active="dash" data-panel></nav>
  <script src="/kit/rail/rail.js"></script>

    <div class="ws">
      <aside class="side">
        <div class="side-head">
          <div class="side-count"><b id="gd-count">—</b><span id="gd-count-label" data-i18n="records_lbl">HỒ SƠ</span></div>
          <label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input type="search" id="gd-q" placeholder="Tìm kênh…" aria-label="Tìm kênh" data-i18n-attr="placeholder:search_channels,aria-label:search_channels"></label>
          <div class="side-field">
            <label for="gd-platform" data-i18n="platform_lbl">Nền tảng</label>
            <select id="gd-platform"></select>
          </div>
          <div class="side-field">
            <label for="gd-sort" data-i18n="sort_lbl">Sắp xếp</label>
            <select id="gd-sort"><option value="clean_low" data-i18n="sort_clean_low">Tỷ lệ nhận thấp nhất</option><option value="clean_high" data-i18n="sort_clean_high">Tỷ lệ nhận cao nhất</option><option value="wait" data-i18n="sort_wait">Chờ nhiều nhất</option><option value="total" data-i18n="sort_total">Nhiều hồ sơ nhất</option><option value="name" data-i18n="sort_alpha">Tên A → Z</option></select>
          </div>
        </div>
        <div class="side-items" id="gd-tree"></div>
        <div class="side-pager"><span id="gd-taken">—</span></div>
      </aside>

    <main class="ws-main gd-stage">
<header class="page-head"><div class="page-title"><a href="http://127.0.0.1:5050/">EURASIA</a><span>/</span><a href="/gate/dash/">GATE</a><span>/</span><h1 id="gd-scope" data-i18n="all_sources_head">TẤT CẢ NGUỒN</h1></div>
  <div class="gd-kind" aria-label="Loại hồ sơ" data-i18n-attr="aria-label:record_type_aria"><button data-kind="video" aria-pressed="true">Video</button><button data-kind="image" aria-pressed="false" data-i18n="kind_image">Ảnh</button></div></header>

<!-- 1. PHỄU: hồ sơ của phần đang chọn nằm ở cửa nào -->
<p id="gd-status" class="gd-note" role="status">Đang đọc số Gate…</p>
<section class="gd-funnel" aria-label="Phễu Gate" data-i18n-attr="aria-label:funnel_aria">
  <div class="gd-funnel-cols" id="gd-funnel"></div>
  <div class="gd-flow" id="gd-flow" aria-hidden="true"></div>
</section>

<p class="gd-note" data-i18n="gd_ratio_note"></p>
<!-- 2. MÁY: soi bao nhiêu, thấy gì -->
<section class="gd-block" id="gd-machine"></section>

<footer class="page-foot"><div></div><div id="gd-foot" data-i18n="real_read_only">SỐ THẬT · CHỈ ĐỌC</div></footer>
    </main>
    </div>

</div>
<script src="/gate/dash/dashboard.js"></script>
</body>
</html>
