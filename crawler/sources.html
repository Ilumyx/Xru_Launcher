<!doctype html>
<!-- Mặt theo bản vẽ PO: design/crawler_sources.html + design/ORDER_crawler_sources.md. Số thật từ /api/board. -->
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRU Crawler — Nguồn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/kit/tokens.css"><link rel="stylesheet" href="/kit/rail/rail.css"><link rel="stylesheet" href="/kit/page/page.css"><link rel="stylesheet" href="/kit/sidebar/sidebar.css"><link rel="stylesheet" href="/kit/frame/frame.css"><link rel="stylesheet" href="sources.css">
  <link rel="stylesheet" href="/kit/account/account.css"><script src="/kit/i18n/i18n.js"></script><script src="/kit/account/account.js"></script><script src="/kit/frame/frame.js"></script>
  <script src="/crawler/rail_menu.js"></script>
</head>
<body class="src"><div class="shell">
  <nav class="rail" data-rail="crawler" data-panel data-active="sources"></nav><script src="/kit/rail/rail.js"></script>
  <div class="ws">
    <aside class="side">
      <div class="side-head">
        <div class="side-count"><b id="src-count">—</b><span>NGUỒN</span></div>
        <label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input type="search" id="src-q" placeholder="Tìm cụm…" aria-label="Tìm cụm"></label>
        <div class="side-field"><label for="src-sort">Sắp xếp trong nhóm</label><select id="src-sort">
          <option value="tier">Hạng cao trước</option><option value="name">Tên A → Z</option><option value="platform">Nền A → Z</option>
          <option value="recent">Cào mới nhất</option><option value="recent_asc">Cào lâu nhất</option><option value="pending">Chờ tải nhiều nhất</option>
          <option value="image">Nhiều ảnh nhất</option><option value="image_asc">Ít ảnh nhất</option><option value="video">Nhiều video nhất</option><option value="video_asc">Ít video nhất</option>
        </select></div>
      </div>
      <div class="side-items" id="src-filters"></div>
      <div class="src-legend">
        <p><i class="dot"></i>scout đỏ = thiếu scout · <b>+</b> = chưa dò tới đáy</p>
        <p>Cũ khi chưa cào quá: A 3n · B 7n · C 14n · D 30n · chưa chấm 7n · F không tính</p>
      </div>
    </aside>
    <div class="ws-main src-scroll">
      <main class="src-main">
        <header class="page-head"><div class="page-title"><a href="/?continent=eurasia">EURASIA</a><span>/</span><a href="/crawler/dash" data-keep>CRAWLER</a><span>/</span><h1>NGUỒN</h1></div><span class="src-stamp" id="src-stamp"></span></header>
        <div id="src-error" role="alert" hidden></div>
        <section class="src-totals" aria-label="Tổng theo nhóm">
          <div><span>ỔN</span><b id="t-ok">—</b></div>
          <div><span>ĐANG CÀO</span><b class="green" id="t-run">—</b></div>
          <div><span>CHƯA CÀO</span><b class="dim" id="t-new">—</b></div>
          <div><span>CẦN NHÌN</span><b class="red" id="t-look">—</b></div>
        </section>
        <table class="src-table">
          <colgroup><col style="width:30px"><col><col style="width:48px"><col style="width:68px"><col style="width:236px"><col style="width:236px"><col style="width:56px"><col style="width:128px"></colgroup>
          <thead><tr><th></th><th data-sort="name">CỤM</th><th>NƯỚC</th><th data-sort="platform">NỀN</th><th data-sort="image">ẢNH</th><th data-sort="video" class="split">VIDEO</th><th data-sort="recent">CÀO</th><th>TRẠNG THÁI</th></tr></thead>
          <tbody id="src-rows"></tbody>
        </table>
        <p class="src-empty" id="src-empty" hidden>Không có nguồn phù hợp.</p>
        <footer class="page-foot"><div></div><div>CHỈ ĐỌC · ẢNH + VIDEO</div></footer>
      </main>
    </div>
    <aside class="ws-insp src-detail" id="src-detail" hidden aria-labelledby="d-name">
      <header><div><p class="d-plat" id="d-plat"></p><h2 id="d-name"></h2><p class="d-sub" id="d-sub"></p></div></header>
      <div class="d-body" id="d-body"></div>
    </aside>
  </div>
  <dialog class="src-shot-view" id="shot-view"><img id="shot-view-img" alt=""></dialog>
</div><script src="sources.js"></script></body></html>
